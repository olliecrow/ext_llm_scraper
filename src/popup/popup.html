<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Webpage Scraper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h2>Scraper Settings</h2>
  <label><input type="checkbox" id="crawlMode"> Crawl sub-pages</label>
  <p id="crawlWarning" hidden>Crawl opens each link on this site. A link can change your account or log you out.</p>
  <label>Max pages: <input type="number" id="maxPages" value="50" min="1" max="2000"></label>
  <label>Concurrency: <input type="number" id="concurrency" value="3" min="1" max="15"></label>
  <label>Delay (ms): <input type="number" id="delay" value="0" min="0" max="60000"></label>
  <button id="startButton">Start</button>
  <button id="stopButton" disabled>Stop</button>
  <button id="clearLogButton">Clear Log</button>

  <div id="status" aria-live="polite">Ready</div>
  <div id="progress">Processed: <span id="processed">0</span> / <span id="total">0</span></div>
  <div id="debugLog"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
