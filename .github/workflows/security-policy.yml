name: Security Policy Checks

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '15 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -sSfL -o "${archive}" "${base_url}/${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${archive}" | sha256sum -c -
          tar -xzf "${archive}"
          install -m 0755 gitleaks "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Self-test security scanners
        run: bash scripts/security/selftest.sh

      # One range policy for every scanner. An empty, all-zero, or missing
      # base (a scheduled run, a new branch, or a rewritten history) scans
      # every commit in the head.
      - name: Scan pushed/PR commits with gitleaks and the text policy
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base="${PR_BASE_SHA}"
            head="${PR_HEAD_SHA}"
          else
            base="${PUSH_BEFORE_SHA}"
            head="${GITHUB_SHA}"
          fi
          commits_file="${RUNNER_TEMP}/push-commits.txt"
          bash scripts/security/check-push-range.sh --list --from "${base}" --to "${head}" > "${commits_file}"
          echo "commits to scan: $(wc -l < "${commits_file}")"
          bash scripts/security/gitleaks-commits.sh "${commits_file}"
          bash scripts/security/check-push-range.sh --from "${base}" --to "${head}"

      - name: Check pull request title/body for policy violations
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          temp_file="$(mktemp)"
          printf '%s\n\n%s\n' "${PR_TITLE}" "${PR_BODY}" > "${temp_file}"
          bash scripts/security/check-sensitive-text.sh --context=pr-metadata "${temp_file}"
